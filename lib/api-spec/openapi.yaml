openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}:
    put:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409":
          description: Version conflict
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteConfirmation" }
      responses:
        "204": { description: Deleted }
  /projects/{id}/brief:
    get:
      operationId: getWeddingBrief
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Role-filtered, sourced wedding progress narrative
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingBrief" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/fil:
    get:
      operationId: getProfileFil
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Role-filtered, sourced cards for the private Profile Fil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFil" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/brief/nearby:
    post:
      operationId: getWeddingBriefNearby
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorldLocationConsent" }
      responses:
        "200":
          description: Owner-authorized nearby categories derived from the confirmed World location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingBrief" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/invitations:
    post:
      operationId: inviteProjectMember
      tags: [members]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitation sent
  /projects/{id}/messages:
    get:
      operationId: listProjectMessages
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Email delivery journal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: createProjectMessage
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Message scheduled or delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "502":
          description: Provider failure recorded in the delivery journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /projects/{id}/messages/{messageId}:
    patch:
      operationId: rescheduleProjectMessage
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/MessageId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageScheduleInput" }
      responses:
        "200":
          description: Rescheduled message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    post:
      operationId: cancelProjectMessage
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Cancelled message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /projects/{id}/rsvp-links/{guestId}:
    delete:
      operationId: revokeRsvpLink
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: guestId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: RSVP link revoked }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
  /rsvp/{token}:
    get:
      operationId: getPublicRsvp
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      responses:
        "200": { description: RSVP invitation }
    put:
      operationId: submitPublicRsvp
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpInput" }
      responses:
        "200": { description: Response recorded }
  /aime-local/pairing-token:
    post:
      operationId: createAimeLocalPairingToken
      tags: [projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pairing token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalPairingToken" }
  /aime-local/bridge/pair:
    post:
      operationId: pairAimeLocalBridge
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AimeLocalPairInput" }
      responses:
        "201":
          description: Bridge paired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalBridgeSession" }
  /aime-local/bridge/status:
    get:
      operationId: getAimeLocalBridgeStatus
      tags: [projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bridge connection status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalBridgeStatus" }
    delete:
      operationId: revokeAimeLocalBridgeStatus
      tags: [projects]
      security:
        - bearerAuth: []
      responses:
        "204": { description: Bridge revoked }
  /projects/{id}/aime-local/folders:
    get:
      operationId: getAimeLocalFolders
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Authorized local folders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalFolders" }
    put:
      operationId: updateAimeLocalFolders
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AimeLocalFolders" }
      responses:
        "200":
          description: Updated authorized folders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalFolders" }
  /projects/{id}/aime-local/scan:
    post:
      operationId: requestAimeLocalScan
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "202":
          description: Scan requested
  /projects/{id}/aime-local/scans/latest:
    get:
      operationId: getAimeLocalLatestScan
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Latest scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalLatestScanResponse" }
  /projects/{id}/aime-local/references:
    get:
      operationId: listAimeLocalReferences
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Local references
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AimeLocalReference" }
    post:
      operationId: createAimeLocalReference
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AimeLocalReferenceInput" }
      responses:
        "201":
          description: Local reference created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalReference" }
  /projects/{id}/aime-local/references/{referenceId}/import:
    post:
      operationId: requestAimeLocalImport
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: referenceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Import requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalImportRequested" }
  /projects/{id}/aime-local/import-jobs/{jobId}:
    get:
      operationId: getAimeLocalImportJob
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Import status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimeLocalImportJob" }
  /public/profiles/{id}:
    get:
      operationId: getPublicProfile
      tags: [profiles]
      summary: Read a published public profile timeline
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Sanitized public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404":
          description: Unknown or unpublished profile
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      required: [id, title, data, role, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        data: { type: object, additionalProperties: true }
        role: { type: string, enum: [owner, planner, family, viewer] }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [title, data]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        data: { type: object, additionalProperties: true }
    ProjectUpdate:
      allOf:
        - { $ref: "#/components/schemas/ProjectInput" }
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    WeddingBriefSource:
      type: object
      required: [collection, id, label]
      properties:
        collection: { type: string, enum: [project, timeline, task, payment] }
        id: { type: string }
        label: { type: string }
        amountCents: { type: number }
        paymentState: { type: string, enum: [paye, du] }
        recordedAt: { type: number }
    WeddingBriefSegment:
      type: object
      required: [id, kind, title, narration, source, supportingSources, evidenceStatus]
      properties:
        id: { type: string }
        kind: { type: string, enum: [transition, fact, calculation, alert, suggestion] }
        title: { type: string }
        narration: { type: string }
        source: { $ref: "#/components/schemas/WeddingBriefSource" }
        supportingSources:
          type: array
          items: { $ref: "#/components/schemas/WeddingBriefSource" }
        at: { type: number }
        evidenceStatus: { type: string, enum: [verified, unverified] }
    NearbyCategorySuggestion:
      type: object
      required: [id, label, reason, evidenceStatus]
      properties:
        id: { type: string }
        label: { type: string }
        reason: { type: string }
        evidenceStatus: { type: string, enum: [unverified] }
    WeddingBriefLocation:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        label: { type: string }
    WeddingBrief:
      type: object
      required: [projectId, role, generatedAt, segments, location, nearbyCategories]
      properties:
        projectId: { type: string }
        role: { type: string, enum: [owner, planner, family, viewer] }
        generatedAt: { type: number }
        segments:
          type: array
          items: { $ref: "#/components/schemas/WeddingBriefSegment" }
        location: { $ref: "#/components/schemas/WeddingBriefLocation" }
        nearbyCategories:
          type: array
          items: { $ref: "#/components/schemas/NearbyCategorySuggestion" }
    ProfileFilSource:
      type: object
      required: [collection, id, label]
      properties:
        collection: { type: string, enum: [project, timeline, task, payment, guide, public_aggregate] }
        id: { type: string }
        label: { type: string }
    ProfileFilAction:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string, enum: [open_timeline, open_world, none] }
        label: { type: string }
        targetId: { type: string }
    ProfileFilCard:
      type: object
      required: [id, category, type, title, summary, priority, reason, source, action, visibility, status, evidenceStatus]
      properties:
        id: { type: string }
        category: { type: string, enum: [now, world, learn, inspiration] }
        type: { type: string, enum: [task, fact, alert, suggestion, tutorial, inspiration] }
        title: { type: string }
        summary: { type: string }
        priority: { type: string, enum: [urgent, high, normal, low] }
        reason: { type: string }
        source: { $ref: "#/components/schemas/ProfileFilSource" }
        action: { $ref: "#/components/schemas/ProfileFilAction" }
        visibility: { type: string, enum: [prive, equipe, audience] }
        status: { type: string, enum: [active] }
        evidenceStatus: { type: string, enum: [verified, unverified] }
    ProfileFil:
      type: object
      required: [projectId, role, generatedAt, cards]
      properties:
        projectId: { type: string }
        role: { type: string, enum: [owner, planner, family, viewer] }
        generatedAt: { type: number }
        cards:
          type: array
          items: { $ref: "#/components/schemas/ProfileFilCard" }
    WorldLocationConsent:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean, const: true }
    DeleteConfirmation:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, const: SUPPRIMER }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [planner, family, viewer] }
    MessageInput:
      type: object
      required: [kind, recipients, subject, body, confirmed]
      properties:
        kind: { type: string, enum: [invitation, rsvp_reminder, practical_info, provider_follow_up, thank_you, event_change] }
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        confirmed: { type: boolean, const: true }
        timelineEventId: { type: string, maxLength: 200 }
        scheduledAt: { type: string, format: date-time }
    MessageScheduleInput:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt: { type: string, format: date-time }
    UploadInput:
      type: object
      required: [projectId, name, contentType, size]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 240 }
        contentType: { type: string }
        size: { type: integer, minimum: 1, maximum: 26214400 }
    UploadTicket:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    Message:
      type: object
      required: [id, projectId, kind, recipients, subject, body, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { type: string }
        recipients:
          type: array
          items: { type: string, format: email }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [scheduled, pending, sent, failed, cancelled] }
        providerError: { type: string, nullable: true }
        timelineEventId: { type: string, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    RsvpInput:
      type: object
      required: [status, attendance, plusOne]
      properties:
        status: { type: string, enum: [confirmed, declined] }
        attendance:
          type: object
          required: [ceremony, cocktail, dinner, brunch]
          properties:
            ceremony: { type: boolean }
            cocktail: { type: boolean }
            dinner: { type: boolean }
            brunch: { type: boolean }
        dietary: { type: string, maxLength: 1000 }
        plusOne: { type: boolean }
        notes: { type: string, maxLength: 2000 }
    PublicTimelineEvent:
      type: object
      required: [id, time, kind, title, status, confidence, phase, universe, visibility]
      properties:
        id: { type: string }
        time: { type: number }
        endTime: { type: number }
        durationMinutes: { type: number }
        kind: { type: string }
        title: { type: string }
        detail: { type: string }
        location: { type: string }
        status: { type: string }
        confidence: { type: string }
        phase: { type: string }
        universe: { type: string }
        provenance: { type: string }
        visibility: { type: string, const: audience }
    PublicProfile:
      type: object
      required: [id, title, timeline]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        universe: { type: string }
        city: { type: string }
        pivot: { type: number }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/PublicTimelineEvent" }
    AimeLocalPairingToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
    AimeLocalPairInput:
      type: object
      required: [token, bridgeId]
      properties:
        token: { type: string }
        bridgeId: { type: string }
        bridgeVersion: { type: string }
    AimeLocalBridgeSession:
      type: object
      required: [bridgeSessionId, sessionToken, expiresAt, userId]
      properties:
        bridgeSessionId: { type: string, format: uuid }
        sessionToken: { type: string }
        expiresAt: { type: string, format: date-time }
        userId: { type: string }
    AimeLocalBridgeStatus:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        bridgeId: { type: string, nullable: true }
        bridgeVersion: { type: string, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    AimeLocalFolders:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items: { type: string }
    AimeLocalEntityMap:
      type: object
      additionalProperties: true
    AimeLocalScanFile:
      type: object
      required: [name, extension, fileType, size, modifiedAt, relativePath, sourceFolder, localIdentifier]
      properties:
        name: { type: string }
        extension: { type: string }
        fileType: { type: string }
        documentType: { type: string }
        size: { type: integer }
        modifiedAt: { type: string, format: date-time }
        relativePath: { type: string }
        sourceFolder: { type: string }
        localIdentifier: { type: string }
        fingerprint: { type: string }
        entities: { $ref: "#/components/schemas/AimeLocalEntityMap" }
    AimeLocalSuggestion:
      type: object
      required: [localIdentifier, score, reason, actions]
      properties:
        localIdentifier: { type: string }
        score: { type: number }
        reason: { type: string }
        actions:
          type: array
          items: { type: string, enum: [link_project, add_timeline, import, ignore] }
    AimeLocalScanJob:
      type: object
      required: [id, projectId, status, createdAt, folders, results, suggestions]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        status: { type: string, enum: [queued, done, failed] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        folders:
          type: array
          items: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/AimeLocalScanFile" }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/AimeLocalSuggestion" }
        error: { type: string }
    AimeLocalLatestScanResponse:
      type: object
      required: [job]
      properties:
        job:
          anyOf:
            - { $ref: "#/components/schemas/AimeLocalScanJob" }
            - { type: "null" }
    AimeLocalReferenceInput:
      type: object
      required: [localIdentifier, filename, relativePath, sourceFolder, fileType, size, modifiedAt]
      properties:
        localIdentifier: { type: string }
        fingerprint: { type: string }
        filename: { type: string }
        relativePath: { type: string }
        sourceFolder: { type: string }
        extension: { type: string }
        fileType: { type: string }
        size: { type: integer }
        modifiedAt: { type: string, format: date-time }
        linkedEntityKind: { type: string }
        linkedEntityId: { type: string }
        linkedTimelineEventId: { type: string }
        metadata: { type: object, additionalProperties: true }
    AimeLocalReference:
      type: object
      required: [id, projectId, ownerUserId, localIdentifier, filename, relativePath, sourceFolder, fileType, size, modifiedAt, state]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        ownerUserId: { type: string }
        localIdentifier: { type: string }
        fingerprint: { type: string, nullable: true }
        filename: { type: string }
        relativePath: { type: string }
        sourceFolder: { type: string }
        extension: { type: string, nullable: true }
        fileType: { type: string }
        size: { type: integer }
        modifiedAt: { type: string, format: date-time }
        state: { type: string, enum: [local, linked, imported, ignored] }
