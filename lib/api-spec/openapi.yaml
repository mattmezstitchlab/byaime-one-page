openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}:
    put:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409":
          description: Version conflict
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteConfirmation" }
      responses:
        "204": { description: Deleted }
  /projects/{id}/brief:
    get:
      operationId: getWeddingBrief
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Role-filtered, sourced wedding progress narrative
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingBrief" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/brief/nearby:
    post:
      operationId: getWeddingBriefNearby
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorldLocationConsent" }
      responses:
        "200":
          description: Owner-authorized nearby categories derived from the confirmed World location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingBrief" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/invitations:
    post:
      operationId: inviteProjectMember
      tags: [members]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitation sent
  /projects/{id}/messages:
    get:
      operationId: listProjectMessages
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Email delivery journal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
  /projects/{id}/rsvp-links/{guestId}:
    delete:
      operationId: revokeRsvpLink
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: guestId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: RSVP link revoked }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
  /rsvp/{token}:
    get:
      operationId: getPublicRsvp
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      responses:
        "200": { description: RSVP invitation }
    put:
      operationId: submitPublicRsvp
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpInput" }
      responses:
        "200": { description: Response recorded }
  /public/profiles/{id}:
    get:
      operationId: getPublicProfile
      tags: [profiles]
      summary: Read a published public profile timeline
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Sanitized public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404":
          description: Unknown or unpublished profile
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      required: [id, title, data, role, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        data: { type: object, additionalProperties: true }
        role: { type: string, enum: [owner, planner, family, viewer] }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [title, data]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        data: { type: object, additionalProperties: true }
    ProjectUpdate:
      allOf:
        - { $ref: "#/components/schemas/ProjectInput" }
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    WeddingBriefSource:
      type: object
      required: [collection, id, label]
      properties:
        collection: { type: string, enum: [project, timeline, task, payment] }
        id: { type: string }
        label: { type: string }
        amountCents: { type: number }
        paymentState: { type: string, enum: [paye, du] }
        recordedAt: { type: number }
    WeddingBriefSegment:
      type: object
      required: [id, kind, title, narration, source, supportingSources, evidenceStatus]
      properties:
        id: { type: string }
        kind: { type: string, enum: [transition, fact, calculation, alert, suggestion] }
        title: { type: string }
        narration: { type: string }
        source: { $ref: "#/components/schemas/WeddingBriefSource" }
        supportingSources:
          type: array
          items: { $ref: "#/components/schemas/WeddingBriefSource" }
        at: { type: number }
        evidenceStatus: { type: string, enum: [verified, unverified] }
    NearbyCategorySuggestion:
      type: object
      required: [id, label, reason, evidenceStatus]
      properties:
        id: { type: string }
        label: { type: string }
        reason: { type: string }
        evidenceStatus: { type: string, enum: [unverified] }
    WeddingBriefLocation:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        label: { type: string }
    WeddingBrief:
      type: object
      required: [projectId, role, generatedAt, segments, location, nearbyCategories]
      properties:
        projectId: { type: string }
        role: { type: string, enum: [owner, planner, family, viewer] }
        generatedAt: { type: number }
        segments:
          type: array
          items: { $ref: "#/components/schemas/WeddingBriefSegment" }
        location: { $ref: "#/components/schemas/WeddingBriefLocation" }
        nearbyCategories:
          type: array
          items: { $ref: "#/components/schemas/NearbyCategorySuggestion" }
    WorldLocationConsent:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean, const: true }
    DeleteConfirmation:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, const: SUPPRIMER }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [planner, family, viewer] }
    UploadInput:
      type: object
      required: [projectId, name, contentType, size]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 240 }
        contentType: { type: string }
        size: { type: integer, minimum: 1, maximum: 26214400 }
    UploadTicket:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    Message:
      type: object
      required: [id, projectId, kind, recipients, subject, body, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { type: string }
        recipients:
          type: array
          items: { type: string, format: email }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, sent, failed] }
        providerError: { type: string, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    RsvpInput:
      type: object
      required: [status, attendance, plusOne]
      properties:
        status: { type: string, enum: [confirmed, declined] }
        attendance:
          type: object
          required: [ceremony, cocktail, dinner, brunch]
          properties:
            ceremony: { type: boolean }
            cocktail: { type: boolean }
            dinner: { type: boolean }
            brunch: { type: boolean }
        dietary: { type: string, maxLength: 1000 }
        plusOne: { type: boolean }
        notes: { type: string, maxLength: 2000 }
    PublicTimelineEvent:
      type: object
      required: [id, time, kind, title, status, confidence, phase, universe, visibility]
      properties:
        id: { type: string }
        time: { type: number }
        endTime: { type: number }
        durationMinutes: { type: number }
        kind: { type: string }
        title: { type: string }
        detail: { type: string }
        location: { type: string }
        status: { type: string }
        confidence: { type: string }
        phase: { type: string }
        universe: { type: string }
        provenance: { type: string }
        visibility: { type: string, const: audience }
    PublicProfile:
      type: object
      required: [id, title, timeline]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        universe: { type: string }
        city: { type: string }
        pivot: { type: number }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/PublicTimelineEvent" }

