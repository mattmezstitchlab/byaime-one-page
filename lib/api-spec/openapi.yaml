openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /network/subjects:
    get:
      operationId: listNetworkSubjects
      tags: [network]
      summary: Read the authorized multi-World network projection
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server-redacted subjects and relations for the Map and List
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkProjection" }
        "401": { description: Authentication required }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}:
    put:
      operationId: updateProject
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "409":
          description: Version conflict
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteConfirmation" }
      responses:
        "204": { description: Deleted }
  /projects/{id}/brief:
    get:
      operationId: getWeddingBrief
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Role-filtered, sourced wedding progress narrative
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingBrief" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/fil:
    get:
      operationId: getProfileFil
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Role-filtered, sourced cards for the private Profile Fil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileFil" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/brief/nearby:
    post:
      operationId: getWeddingBriefNearby
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorldLocationConsent" }
      responses:
        "200":
          description: Owner-authorized nearby categories derived from the confirmed World location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeddingBrief" }
        "404": { description: Unknown or inaccessible project }
  /projects/{id}/invitations:
    post:
      operationId: inviteProjectMember
      tags: [members]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitation sent
  /projects/{id}/messages:
    get:
      operationId: listProjectMessages
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Email delivery journal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      operationId: createProjectMessage
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Message scheduled or delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "502":
          description: Provider failure recorded in the delivery journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /projects/{id}/messages/{messageId}:
    patch:
      operationId: rescheduleProjectMessage
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/MessageId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageScheduleInput" }
      responses:
        "200":
          description: Rescheduled message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    post:
      operationId: cancelProjectMessage
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/MessageId" }
      responses:
        "200":
          description: Cancelled message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /projects/{id}/rsvp-links/{guestId}:
    delete:
      operationId: revokeRsvpLink
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: guestId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: RSVP link revoked }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
  /rsvp/{token}:
    get:
      operationId: getPublicRsvp
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      responses:
        "200": { description: RSVP invitation }
    put:
      operationId: submitPublicRsvp
      tags: [rsvp]
      parameters:
        - { $ref: "#/components/parameters/Token" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RsvpInput" }
      responses:
        "200": { description: Response recorded }
  /public/profiles/{id}:
    get:
      operationId: getPublicProfile
      tags: [profiles]
      summary: Read a published public profile timeline
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Sanitized public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404":
          description: Unknown or unpublished profile
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    UniversalReference:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [card, world, place, moment, resource] }
        id: { type: string }
    CapabilityDecision:
      type: object
      required: [allowed, reason]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        requiresAuthentication: { type: boolean }
        requiresConfirmation: { type: boolean }
    NetworkCapability:
      type: string
      enum: [card.view, card.contact, world.view, world.edit, moment.edit]
    LegacyTrace:
      type: object
      description: Auditable source identifier; never the canonical subject key
      required: [source, entityKind, legacyId]
      properties:
        source: { type: string, enum: [world_project_json, supabase] }
        entityKind: { type: string }
        legacyId: { type: string }
    NetworkSubject:
      type: object
      required: [ref, worldRef, label, locationLevel, capabilities]
      properties:
        ref: { $ref: "#/components/schemas/UniversalReference" }
        worldRef: { $ref: "#/components/schemas/UniversalReference" }
        label: { type: string }
        summary: { type: string }
        imageUrl: { type: string, format: uri }
        locationLevel: { type: string, enum: [public, network, world, operations, private, exact_location] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        city: { type: string }
        primaryCapability: { $ref: "#/components/schemas/NetworkCapability" }
        legacy: { $ref: "#/components/schemas/LegacyTrace" }
        capabilities:
          type: object
          additionalProperties: { $ref: "#/components/schemas/CapabilityDecision" }
    NetworkRelation:
      type: object
      required: [id, from, to, kind, visibility]
      properties:
        id: { type: string }
        from: { $ref: "#/components/schemas/UniversalReference" }
        to: { $ref: "#/components/schemas/UniversalReference" }
        kind: { type: string }
        visibility: { type: string, enum: [public, network, world, operations, financial, private, exact_location, moderation] }
    NetworkProjection:
      type: object
      required: [generatedAt, subjects, relations]
      properties:
        generatedAt: { type: string, format: date-time }
        subjects:
          type: array
          items: { $ref: "#/components/schemas/NetworkSubject" }
        relations:
          type: array
          items: { $ref: "#/components/schemas/NetworkRelation" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      required: [id, title, data, role, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        data: { type: object, additionalProperties: true }
        role: { type: string, enum: [owner, planner, family, viewer] }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [title, data]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        data: { type: object, additionalProperties: true }
    ProjectUpdate:
      allOf:
        - { $ref: "#/components/schemas/ProjectInput" }
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    WeddingBriefSource:
      type: object
      required: [collection, id, label]
      properties:
        collection: { type: string, enum: [project, timeline, task, payment] }
        id: { type: string }
        label: { type: string }
        amountCents: { type: number }
        paymentState: { type: string, enum: [paye, du] }
        recordedAt: { type: number }
    WeddingBriefSegment:
      type: object
      required: [id, kind, title, narration, source, supportingSources, evidenceStatus]
      properties:
        id: { type: string }
        kind: { type: string, enum: [transition, fact, calculation, alert, suggestion] }
        title: { type: string }
        narration: { type: string }
        source: { $ref: "#/components/schemas/WeddingBriefSource" }
        supportingSources:
          type: array
          items: { $ref: "#/components/schemas/WeddingBriefSource" }
        at: { type: number }
        evidenceStatus: { type: string, enum: [verified, unverified] }
    NearbyCategorySuggestion:
      type: object
      required: [id, label, reason, evidenceStatus]
      properties:
        id: { type: string }
        label: { type: string }
        reason: { type: string }
        evidenceStatus: { type: string, enum: [unverified] }
    WeddingBriefLocation:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        label: { type: string }
    WeddingBrief:
      type: object
      required: [projectId, role, generatedAt, segments, location, nearbyCategories]
      properties:
        projectId: { type: string }
        role: { type: string, enum: [owner, planner, family, viewer] }
        generatedAt: { type: number }
        segments:
          type: array
          items: { $ref: "#/components/schemas/WeddingBriefSegment" }
        location: { $ref: "#/components/schemas/WeddingBriefLocation" }
        nearbyCategories:
          type: array
          items: { $ref: "#/components/schemas/NearbyCategorySuggestion" }
    ProfileFilSource:
      type: object
      required: [collection, id, label]
      properties:
        collection: { type: string, enum: [project, timeline, task, payment, guide, public_aggregate] }
        id: { type: string }
        label: { type: string }
    ProfileFilAction:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string, enum: [open_timeline, open_world, none] }
        label: { type: string }
        targetId: { type: string }
    ProfileFilCard:
      type: object
      required: [id, category, type, title, summary, priority, reason, source, action, visibility, status, evidenceStatus]
      properties:
        id: { type: string }
        category: { type: string, enum: [now, world, learn, inspiration] }
        type: { type: string, enum: [task, fact, alert, suggestion, tutorial, inspiration] }
        title: { type: string }
        summary: { type: string }
        priority: { type: string, enum: [urgent, high, normal, low] }
        reason: { type: string }
        source: { $ref: "#/components/schemas/ProfileFilSource" }
        action: { $ref: "#/components/schemas/ProfileFilAction" }
        visibility: { type: string, enum: [prive, equipe, audience] }
        status: { type: string, enum: [active] }
        evidenceStatus: { type: string, enum: [verified, unverified] }
    ProfileFil:
      type: object
      required: [projectId, role, generatedAt, cards]
      properties:
        projectId: { type: string }
        role: { type: string, enum: [owner, planner, family, viewer] }
        generatedAt: { type: number }
        cards:
          type: array
          items: { $ref: "#/components/schemas/ProfileFilCard" }
    WorldLocationConsent:
      type: object
      required: [consent]
      properties:
        consent: { type: boolean, const: true }
    DeleteConfirmation:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, const: SUPPRIMER }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [planner, family, viewer] }
    MessageInput:
      type: object
      required: [kind, recipients, subject, body, confirmed]
      properties:
        kind: { type: string, enum: [invitation, rsvp_reminder, practical_info, provider_follow_up, thank_you, event_change] }
        recipients:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        confirmed: { type: boolean, const: true }
        timelineEventId: { type: string, maxLength: 200 }
        scheduledAt: { type: string, format: date-time }
    MessageScheduleInput:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt: { type: string, format: date-time }
    UploadInput:
      type: object
      required: [projectId, name, contentType, size]
      properties:
        projectId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 240 }
        contentType: { type: string }
        size: { type: integer, minimum: 1, maximum: 26214400 }
    UploadTicket:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    Message:
      type: object
      required: [id, projectId, kind, recipients, subject, body, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        kind: { type: string }
        recipients:
          type: array
          items: { type: string, format: email }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [scheduled, pending, sent, failed, cancelled] }
        providerError: { type: string, nullable: true }
        timelineEventId: { type: string, nullable: true }
        scheduledAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    RsvpInput:
      type: object
      required: [status, attendance, plusOne]
      properties:
        status: { type: string, enum: [confirmed, declined] }
        attendance:
          type: object
          required: [ceremony, cocktail, dinner, brunch]
          properties:
            ceremony: { type: boolean }
            cocktail: { type: boolean }
            dinner: { type: boolean }
            brunch: { type: boolean }
        dietary: { type: string, maxLength: 1000 }
        plusOne: { type: boolean }
        notes: { type: string, maxLength: 2000 }
    PublicTimelineEvent:
      type: object
      required: [id, time, kind, title, status, confidence, phase, universe, visibility]
      properties:
        id: { type: string }
        time: { type: number }
        endTime: { type: number }
        durationMinutes: { type: number }
        kind: { type: string }
        title: { type: string }
        detail: { type: string }
        location: { type: string }
        status: { type: string }
        confidence: { type: string }
        phase: { type: string }
        universe: { type: string }
        provenance: { type: string }
        visibility: { type: string, const: audience }
    PublicProfile:
      type: object
      required: [id, title, timeline]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        universe: { type: string }
        city: { type: string }
        pivot: { type: number }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/PublicTimelineEvent" }
