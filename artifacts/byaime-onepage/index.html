    <script>
      // Décision du 2026-09-13 : l'app est blanche, le sombre n'est plus
      // reachable depuis l'interface. Le thème clair est posé avant la première
      // peinture pour que `color-scheme` suive — sinon les contrôles natifs, la
      // barre de défilement et les sélections restaient sombres sur une page
      // 100 % blanche, y compris pour une valeur « dark » héritée du
      // localStorage d'une version antérieure.
      document.documentElement.dataset.aimeTheme = 'light';
    </script>
    <style>

        margin: 0;
        /* Repli avant chargement du CSS : les mêmes valeurs que :root (blanc). */
