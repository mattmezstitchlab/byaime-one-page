    <script>
      // L'apparence est lue avant la première peinture : pas de flash sombre
      // pour les personnes qui ont choisi le mode clair.
      try {
        var appearance = localStorage.getItem('aime-appearance');
        document.documentElement.dataset.aimeTheme = appearance === 'light' ? 'light' : 'dark';
      } catch (error) {
        document.documentElement.dataset.aimeTheme = 'dark';
      }
    </script>
