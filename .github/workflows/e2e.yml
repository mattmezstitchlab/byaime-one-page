name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aime
          POSTGRES_PASSWORD: aime
          POSTGRES_DB: aime_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aime -d aime_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://aime:aime@127.0.0.1:5432/aime_e2e
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      AIME_E2E_RUN: "1"
      AIME_E2E_BASE_URL: http://127.0.0.1:5173
      AIME_E2E_COLLABORATOR_EMAIL: aime-collaborator-${{ github.run_id }}-${{ github.run_attempt }}@example.com
      SESSION_SECRET: ci-only-upload-signing-secret-not-used-outside-runner

    steps:
      - uses: actions/checkout@v4
      - name: Initialize E2E paths
        run: |
          {
            echo "AIME_E2E_OWNER_STATE=$RUNNER_TEMP/aime-owner.json"
            echo "AIME_E2E_COLLABORATOR_STATE=$RUNNER_TEMP/aime-collaborator.json"
            echo "AIME_E2E_CLERK_USERS_FILE=$RUNNER_TEMP/aime-clerk-users.json"
            echo "AIME_E2E_STORAGE_DIR=$RUNNER_TEMP/aime-storage"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require Clerk CI secrets
        run: |
          test -n "$CLERK_SECRET_KEY"
          test -n "$CLERK_PUBLISHABLE_KEY"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:e2e
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare PostgreSQL
        run: pnpm --filter @workspace/db run push
      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Start test services
        run: |
          PORT=5000 NODE_ENV=development pnpm --filter @workspace/api-server run start >"$RUNNER_TEMP/api.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/api.pid"
          PORT=5173 BASE_PATH=/ AIME_API_URL=http://127.0.0.1:5000 pnpm --filter @workspace/byaime-onepage run dev >"$RUNNER_TEMP/web.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/web.pid"
          node --input-type=module -e '
            const urls = ["http://127.0.0.1:5000/api/healthz", "http://127.0.0.1:5000/api/__e2e/ready", "http://127.0.0.1:5173/"];
            const end = Date.now() + 60000;
            while (urls.length && Date.now() < end) {
              for (let i = urls.length - 1; i >= 0; i--) {
                try { if ((await fetch(urls[i])).ok) urls.splice(i, 1); } catch {}
              }
              if (urls.length) await new Promise(r => setTimeout(r, 500));
            }
            if (urls.length) throw new Error(`Services unavailable: ${urls.join(", ")}`);
          '

      - name: Run desktop and mobile E2E
        run: pnpm run e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log

      - name: Stop test services
        if: always()
        run: |
          test ! -f "$RUNNER_TEMP/api.pid" || kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
